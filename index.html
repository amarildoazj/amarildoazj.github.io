<style>
  /* Cores e fontes iguais às do site Ferramentas */
  :root {
    --bg: #f5f3ec; --surface: #fbfaf6; --fg: #29261f; --muted: #6f6a5c; --line: #e1ddd0;
    --accent: #c4623f; --btn-bg: #b0512f;
    --font-display: "Newsreader", "Iowan Old Style", Georgia, serif;
    --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1f1d19; --surface: #272520; --fg: #efebe0; --muted: #a39e8f; --line: #3a372f;
      --accent: #e08863; --btn-bg: #e08863; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1f1d19; --surface: #272520; --fg: #efebe0; --muted: #a39e8f; --line: #3a372f;
    --accent: #e08863; --btn-bg: #e08863; color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
    min-height: 100dvh; display: grid; place-items: center;
    padding: 4.5rem 1.25rem calc(2rem + env(safe-area-inset-bottom));
  }
  .tema {
    position: fixed; top: 1rem; right: 1rem; display: inline-flex; align-items: center; gap: 0.5rem;
    font: inherit; font-size: 0.8125rem; font-weight: 600; color: var(--fg); background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px; padding: 0.45rem 0.9rem; cursor: pointer;
  }
  .tema:hover { border-color: var(--accent); }
  .tema:focus-visible, .link:focus-visible .bola { outline: 2px solid var(--accent); outline-offset: 3px; }
  .tema svg { width: 1rem; height: 1rem; }
  .tema [hidden] { display: none; }
  @media (max-width: 40rem) {
    .tema { width: 2.5rem; height: 2.5rem; padding: 0; justify-content: center; }
    .tema .rot { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  }
  main { width: 100%; max-width: 56rem; text-align: center; }
  h1 {
    font-family: var(--font-display); font-weight: 400; letter-spacing: -0.01em; line-height: 1.05;
    font-size: clamp(2.25rem, 7vw, 4.5rem); margin: 0 0 clamp(2rem, 6vw, 3.5rem); text-wrap: balance;
  }
  .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.75rem 1.5rem; }
  .link {
    display: flex; flex-direction: column; align-items: center; gap: 0.7rem; width: 6.5rem;
    color: var(--fg); text-decoration: none; touch-action: manipulation;
  }
  .link:focus { outline: none; }
  .bola {
    width: 5.5rem; height: 5.5rem; border-radius: 50%; display: grid; place-items: center; color: #fff;
    background: var(--cor); border: 1px solid var(--line); box-shadow: 0 6px 16px rgba(0, 0, 0, .18);
    transition: transform .2s, box-shadow .2s;
  }
  .bola svg { width: 52%; height: 52%; display: block; }
  .nome { font-size: 0.9375rem; font-weight: 500; color: var(--muted); }
  @media (hover: hover) {
    .link:hover .bola { transform: scale(1.08); box-shadow: 0 10px 24px rgba(0, 0, 0, .28); }
    .link:hover .nome { color: var(--fg); }
  }
  .link:active .bola { transform: scale(.96); }
  @media (prefers-reduced-motion: reduce) { .bola { transition: none; } }
</style>
</head>
<body>
<button type="button" class="tema" id="tema" aria-pressed="false" title="Modo escuro">
  <span id="lua"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path
    d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
  <span id="sol" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path
    d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
  <span class="rot" id="rot">Modo escuro</span>
</button>

<main>
  <h1>Amarildo Antonio Zuffo Junior</h1>
  <nav class="links" id="links" aria-label="Links"></nav>
</main>

<script>
/* ============================================================
   CONFIGURAÇÃO  (é só mexer aqui)
   Para adicionar um link novo: copie uma linha de LINKS, troque nome, url, cor e icone.
   "icone" é o desenho (24×24, traço branco) em SVG; veja ICONES logo abaixo.
   ============================================================ */
var LINKS = [
  { nome: 'Ferramentas', url: 'https://amarildoazj.github.io/ferramentas/', cor: '#c4623f', icone: 'ferramentas' }
];
var ICONES = {
  ferramentas: '<path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>'
};
var CHAVE_TEMA = 'ferramentas-tema';   /* mesma chave do site Ferramentas: o tema vale para os dois */

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var H = document.documentElement;

  LINKS.forEach(function (l) {
    var a = document.createElement('a');
    a.className = 'link'; a.href = l.url; a.setAttribute('aria-label', l.nome);
    a.style.setProperty('--cor', l.cor);
    a.innerHTML = '<span class="bola"><svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONES[l.icone] || '') +
      '</svg></span><span class="nome"></span>';
    a.querySelector('.nome').textContent = l.nome;
    $('links').appendChild(a);
  });

  /* modo escuro/claro: segue o aparelho até a pessoa escolher; a escolha fica salva */
  var escuro = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  try {
    var s = localStorage.getItem(CHAVE_TEMA);
    if (s === 'dark' || s === 'light') escuro = s === 'dark';
  } catch (e) {}
  function aplica() {
    H.setAttribute('data-theme', escuro ? 'dark' : 'light');
    $('tema').setAttribute('aria-pressed', escuro ? 'true' : 'false');
    $('lua').hidden = escuro; $('sol').hidden = !escuro;
    $('rot').textContent = escuro ? 'Modo claro' : 'Modo escuro';
    $('tema').title = $('rot').textContent;
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', escuro ? '#1f1d19' : '#f5f3ec');
  }
  $('tema').addEventListener('click', function () {
    escuro = !escuro;
    try { localStorage.setItem(CHAVE_TEMA, escuro ? 'dark' : 'light'); } catch (e) {}
    aplica();
  });
  aplica();
})();
</script>
</body>
</html>
