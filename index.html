<style>
  :root {
    --bg: #000000; --ink: #fff6cc; --ring: #ffd60a; --cor: #c4623f;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    min-height: 100dvh; display: grid; place-items: center;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
  }
  .link {
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    color: inherit; text-decoration: none; touch-action: manipulation;
  }
  .link:focus { outline: none; }
  .link:focus-visible .bola { outline: 3px solid var(--ring); outline-offset: 5px; }
  .bola {
    width: min(46vw, 180px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
    color: #fff; background: var(--cor); border: 2px solid rgba(255, 255, 255, .28);
    box-shadow: 0 10px 28px rgba(0, 0, 0, .5); transition: transform .2s, box-shadow .2s;
    animation: entra .6s cubic-bezier(.2, .9, .2, 1.2) backwards;
  }
  .bola svg { width: 54%; height: 54%; display: block; }
  .nome { font-size: clamp(20px, 5vw, 26px); font-weight: 700; letter-spacing: .01em; }
  @media (hover: hover) {
    .link:hover .bola { transform: scale(1.08); box-shadow: 0 14px 34px rgba(0, 0, 0, .65); }
  }
  .link:active .bola { transform: scale(.97); }
  @keyframes entra { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .bola { animation: none; transition: none; } }
</style>
</head>
