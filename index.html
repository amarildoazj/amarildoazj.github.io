<style>
  :root {
    --bg: #000000; --ink: #fff6cc; --muted: #b3a66a;
    --ring: #ffd60a; --line: rgba(255, 255, 255, .85); --foto-bg: #ffd60a; --foto-ink: #0b0b0b;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink); font-family: var(--sans);
    min-height: 100dvh; height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
  }
  a, button { touch-action: manipulation; font-family: inherit; }
  a:focus, button:focus { outline: none; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--ring); outline-offset: 3px; }

  /* palco: foto no meio, redes ao redor */
  .palco {
    position: relative; flex: none; touch-action: none; -webkit-user-select: none; user-select: none;
    width: min(94vw, 560px, calc(100dvh - 80px)); aspect-ratio: 1; margin: 0 auto;
  }
  .pista { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .palco:not(.aberto) .pista { opacity: 0; }
  .palco.aberto .pista { animation: anel .75s cubic-bezier(.2,.9,.2,1.15) .15s backwards; }
  @keyframes anel { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: none; } }
  .pista circle { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: .01 2.1; stroke-linecap: round;
    transform-origin: 50% 50%; animation: gira 70s linear infinite; }
  .pista #raios { display: none; }
  .pista #raios line { stroke: var(--line); stroke-width: 1; stroke-dasharray: .01 2.1; stroke-linecap: round; animation: flui .61s linear infinite; }
  @keyframes flui { to { stroke-dashoffset: -2.11; } }
  @keyframes gira { to { transform: rotate(360deg); } }

  .palco:not(.aberto) .rede { display: none; }
  .foto { cursor: pointer;
    position: absolute; left: 50%; top: 50%; width: 41%; aspect-ratio: 1; border-radius: 50%;
    transform: translate(-50%, -50%); overflow: hidden;
    background: var(--foto-bg);
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    animation: entra .7s cubic-bezier(.2,.9,.2,1.2) backwards;
  }
  .foto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .4s; }
  .foto.ok img { opacity: 1; }
  .foto .ini { position: absolute; inset: 0; display: grid; place-items: center; color: var(--foto-ink);
    font: 800 clamp(34px, 11vw, 86px)/1 var(--sans); letter-spacing: -.02em; }
  .foto.ok .ini { display: none; }

  .rede {
    position: absolute; width: var(--d, 19%); aspect-ratio: 1; border-radius: 50%;
    left: calc(50% + var(--x) * 38.5%); top: calc(50% + var(--y) * 38.5%);
    margin: calc(var(--d, 19%) / -2) 0 0 calc(var(--d, 19%) / -2);
    display: grid; place-items: center; color: #fff; text-decoration: none;
    background: var(--cor); background-origin: border-box; background-clip: border-box; border: 2px solid rgba(255,255,255,.28);
    box-shadow: 0 6px 14px rgba(0,0,0,.35);
    animation: sai .6s cubic-bezier(.2,.9,.2,1.15) backwards; animation-delay: calc(.15s + var(--i) * .07s);
    transition: transform .2s, box-shadow .2s;
  }
  .rede::before {
    content: ""; position: absolute; border-radius: 50%; pointer-events: none;
    opacity: 0; scale: .7; transition: opacity .25s, scale .3s;
  }
  .rede::before { inset: -9%; border: 2.5px dashed #fff; }
  @media (hover: hover) { .rede:hover::before { opacity: 1; scale: 1; animation: giraR 12s linear infinite; } }
  @keyframes giraR { to { rotate: 360deg; } }
  .rede svg { width: 54%; height: 54%; display: block; }
  @media (hover: hover) {
    .rede:hover { transform: scale(1.22); box-shadow: 0 10px 24px rgba(0,0,0,.6); z-index: 3; }
    .rede:active { transform: scale(1.1); z-index: 3; }
  }
  @media (hover: none), (max-width: 700px) { .rede::before { display: none; } .rede:hover, .rede:focus-visible, .rede:active { transform: none; box-shadow: none; } }
  @keyframes sai { from { opacity: 0; transform: translate(calc(var(--x) * -190%), calc(var(--y) * -190%)) scale(.2); } to { opacity: 1; transform: none; } }
  @keyframes entra { from { opacity: 0; transform: translate(-50%, -50%) scale(.6); } to { opacity: 1; transform: translate(-50%, -50%); } }

  .so-leitor { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  @media (prefers-reduced-motion: reduce) {
    .pista circle, .pista #raios line { animation: none; }
    .foto, .rede { animation: none; }
    .rede::before { animation: none !important; }
    * { transition-duration: .01s !important; }
  }
</style>
</head>

    linkedin: '<g fill="currentColor"><rect x="3.6" y="8.6" width="3.6" height="11.6" rx=".6"/><circle cx="5.4" cy="4.9" r="2.1"/><path d="M10 8.6h3.4v1.7c.6-1.1 1.9-2 3.8-2 3.5 0 4.2 2.3 4.2 5.4v6.5h-3.6v-5.8c0-1.4-.1-2.9-1.9-2.9s-2.1 1.3-2.1 2.8v5.9H10z"/></g>',
    instagram: '<g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5.2"/><circle cx="12" cy="12" r="4.1"/></g><circle cx="17.2" cy="6.8" r="1.25" fill="currentColor"/>',
    facebook: '<path fill="currentColor" d="M13.6 21.5v-8.2h2.8l.5-3.3h-3.3V7.9c0-1 .4-1.7 1.8-1.7h1.6V3.3c-.3 0-1.3-.2-2.5-.2-2.6 0-4.3 1.6-4.3 4.4V10H7.4v3.3h2.8v8.2z"/>',
    messenger: '<path fill="currentColor" fill-rule="evenodd" d="M12 2.2C6.6 2.2 2.4 6.2 2.4 11.2c0 2.7 1.2 5.1 3.2 6.8v3.9l3.5-1.9c.9.3 1.9.4 2.9.4 5.4 0 9.6-4 9.6-9.2S17.4 2.2 12 2.2zM5.4 14.4l4.8-5.2 2.8 2.6 4.6-2.6-4.8 5.2-2.8-2.6z"/>',
    whatsapp: '<path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3z"/><path fill="currentColor" d="M8.9 7.9c-.4.3-.8.9-.7 1.7.2 2.6 2.7 5.4 5.7 6.2.9.2 1.6-.2 2-.8l.3-.6c.1-.3 0-.5-.3-.6l-1.5-.7c-.2-.1-.5-.1-.7.1l-.5.6c-.2.2-.4.2-.6.1-1.3-.6-2.3-1.6-2.8-2.8-.1-.2 0-.4.1-.6l.5-.6c.2-.2.2-.4.1-.7l-.6-1.5c-.1-.3-.4-.4-.7-.3z"/>',
    x: '<path fill="currentColor" d="M17.8 3h3L14.2 10.5 22 21h-6.1l-4.8-6.3L5.6 21h-3l7.1-8.1L2 3h6.3l4.3 5.7zm-1 16.2h1.7L7.2 4.7H5.4z"/>',
    tiktok: '<g transform="translate(-1.15 1.55)" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M14.4 3v11.2a3.7 3.7 0 1 1-3.7-3.7"/><path d="M14.4 3c.3 2.7 2 4.4 4.9 4.7"/></g>',
    threads: '<g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="11.7" cy="12" r="3.4"/><path d="M15.1 8.9v4.3c0 1.8 1.2 2.9 2.7 2.9 1.7 0 2.7-1.5 2.7-4.1A8.5 8.5 0 1 0 15.6 19.8"/></g>',
    github: '<g transform="scale(1.5)"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></g>',
    ferramentas: '<path fill="none" stroke="#ffd60a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
    youtube: '<rect x="2.2" y="5.2" width="19.6" height="13.6" rx="4" fill="#fff"/><path fill="#ff0000" d="M10 9v6l5.2-3z"/>',
    ytmusic: '<circle cx="12" cy="12" r="11.4" fill="#ff0000"/><circle cx="12" cy="12" r="8" fill="none" stroke="#fff" stroke-width="1.7"/><path fill="#fff" d="M10.2 8.2v7.6l6.2-3.8z"/>',
    rota: '<g transform="translate(3.6 1.1) scale(.42)"><path fill="#ffd60a" fill-rule="evenodd" d="M20 51C8 36 2 28 2 19a18 18 0 0 1 36 0c0 9-6 17-18 32zM20 11a8 8 0 1 0 0 16 8 8 0 0 0 0-16z"/></g>'
  };

  document.title = CONFIG.usuario;
  $('nome').textContent = CONFIG.nome;
  $('ini').textContent = CONFIG.iniciais;

  /* redes em círculo, começando do topo, no sentido horário */
  var palco = $('palco'), n = CONFIG.redes.length, itens = [];
  CONFIG.redes.forEach(function (r, i) {
    var a = (-90 + i * 360 / n) * Math.PI / 180;
    var el = document.createElement('a');
    el.className = 'rede';
    el.href = r.url.replace('{whatsapp}', CONFIG.whatsapp);
    el.target = '_blank'; el.rel = 'noopener';
    el.setAttribute('aria-label', r.nome + ' · @' + CONFIG.usuario);
    el.title = r.nome;
    el.style.setProperty('--x', Math.cos(a).toFixed(4));
    el.style.setProperty('--y', Math.sin(a).toFixed(4));
    el.style.setProperty('--i', i);
    el.style.setProperty('--d', Math.min(19, 77 * Math.sin(Math.PI / n) - 1.3).toFixed(2) + '%');
    el.style.setProperty('--cor', r.cor);
    el.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONES[r.id] + '</svg>';
    palco.appendChild(el);
    var ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    ln.setAttribute('x1', 50); ln.setAttribute('y1', 50);
    ln.setAttribute('x2', (50 + Math.cos(a) * 38.5).toFixed(2));
    ln.setAttribute('y2', (50 + Math.sin(a) * 38.5).toFixed(2));
    $('raios').appendChild(ln);
    itens.push({ el: el, ln: ln, a: a });
  });

  /* gira todas as bolas em volta da foto (rot = ângulo extra, em radianos) */
  var rot = 0;
  function aplica(r) {
    rot = r;
    itens.forEach(function (it) {
      var a = it.a + r, x = Math.cos(a), y = Math.sin(a);
      it.el.style.setProperty('--x', x.toFixed(4));
      it.el.style.setProperty('--y', y.toFixed(4));
      it.ln.setAttribute('x2', (50 + x * 38.5).toFixed(2));
      it.ln.setAttribute('y2', (50 + y * 38.5).toFixed(2));
    });
  }
  var suave = function (k) { return k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; };
  var forte = function (k) { return 1 - Math.pow(1 - k, 4); };
  var PASSO = Math.PI * 2 / n, TAU = Math.PI * 2;

  /* anima rot até "alvo" */
  var raf = 0, ocupado = false;
  function vai(alvo, dur, ease, fim) {
    cancelAnimationFrame(raf);
    var r0 = rot, t0 = performance.now();
    ocupado = true;
    (function passo(t) {
      var k = Math.min((t - t0) / dur, 1);
      aplica(r0 + (alvo - r0) * ease(k));
      if (k < 1) raf = requestAnimationFrame(passo); else { ocupado = false; if (fim) fim(); }
    })(t0);
  }

  /* foto: 5 toques = giro rápido sem parar; mais 1 toque = vai parando até a posição original;
     com as bolas giradas à mão, 1 toque devolve às posições originais */
  var cliques = 0, tCli = 0, girando = false, W = 0, wMax = .0065, rodando = 0;
  function dispara() {
    girando = true; cliques = 0;
    cancelAnimationFrame(raf); ocupado = false;
    var tAnt = performance.now(), t0 = tAnt;
    rodando = 1;
    (function passo(t) {
      if (!rodando) return;
      var dt = t - tAnt; tAnt = t;
      W = wMax * Math.min((t - t0) / 900, 1);          /* acelera até a velocidade máxima */
      aplica(rot + W * dt);
      requestAnimationFrame(passo);
    })(tAnt);
  }
  function freia() {
    rodando = 0;
    var alvo = Math.ceil((rot + W * 700) / TAU) * TAU;  /* próxima passagem pela posição original */
    var dist = alvo - rot, dur = Math.max(1500, Math.min(4 * dist / Math.max(W, .0005), 4500));
    vai(alvo, dur, forte, function () { aplica(0); girando = false; });
  }
  $('foto').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.click(); }
  });
  $('foto').addEventListener('click', function () {
    /* primeiro toque: as bolas aparecem */
    if (!palco.classList.contains('aberto')) {
      palco.classList.add('aberto'); cliques = 0;
      $('foto').setAttribute('aria-expanded', 'true'); $('foto').setAttribute('aria-label', 'Foto de perfil');
      return;
    }
    if (rodando) { freia(); return; }
    if (girando) return;
    var casa = Math.round(rot / TAU) * TAU;
    if (Math.abs(rot - casa) > .001) {
      vai(casa, Math.min(500 + Math.abs(casa - rot) * 450, 1800), suave, function () { aplica(0); });
      return;
    }
    var agora = Date.now();
    if (agora - tCli > 4000) cliques = 0;
    tCli = agora; cliques++;
    if (cliques >= 5) dispara();
  });

  /* celular: segure e arraste as bolas; solte rápido e elas giram como roleta,
     sempre parando numa das posições originais */
  var dedo = null, moveu = false;
  function angDe(e) {
    var r = palco.getBoundingClientRect();
    return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2));
  }
  palco.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' || girando || !palco.classList.contains('aberto')) return;
    cancelAnimationFrame(raf); ocupado = false;
    dedo = { id: e.pointerId, ang: angDe(e), x: e.clientX, y: e.clientY, v: 0, t: performance.now() };
    moveu = false;
    try { palco.setPointerCapture(e.pointerId); } catch (x) {}
  });
  palco.addEventListener('pointermove', function (e) {
    if (!dedo || e.pointerId !== dedo.id) return;
    if (Math.abs(e.clientX - dedo.x) + Math.abs(e.clientY - dedo.y) > 8) moveu = true;
    if (!moveu) return;
    var a = angDe(e), d = a - dedo.ang;
    if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU;
    var t = performance.now(), dt = Math.max(t - dedo.t, 1);
    dedo.v = dedo.v * .6 + (d / dt) * .4;   /* rad/ms, suavizado */
    dedo.ang = a; dedo.t = t;
    aplica(rot + d);
  });
  function solta(e) {
    if (!dedo || e.pointerId !== dedo.id) return;
    var v = dedo.v, parado = performance.now() - dedo.t > 90;
    dedo = null;
    if (!moveu) return;
    if (parado) v = 0;                       /* segurou parado antes de soltar */
    var alvo = Math.round((rot + v * 1100) / PASSO) * PASSO;   /* onde a roleta vai parar */
    var dist = Math.abs(alvo - rot);
    vai(alvo, Math.min(300 + dist * 380, 4200), forte, function () { aplica(Math.round(rot / PASSO) * PASSO); });
  }
  palco.addEventListener('pointerup', solta);
  palco.addEventListener('pointercancel', solta);
  palco.addEventListener('click', function (e) {
    if (moveu) { e.preventDefault(); e.stopPropagation(); moveu = false; }
  }, true);

  /* foto: usa a imagem se ela existir; senão ficam as iniciais */
  var img = $('img');
  img.onload = function () { if (img.naturalWidth) { $('foto').classList.add('ok'); img.alt = CONFIG.nome; } };
  img.src = CONFIG.foto;
})();
